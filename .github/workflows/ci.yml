name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Testleri atla (sadece build)"
        required: false
        default: "false"
      skip_docker:
        description: "Docker build'ını atla (sadece test)"
        required: false
        default: "false"

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_docker != 'true' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy

      - name: Run Black (format check)
        run: black --check --diff .

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run MyPy (type check)
        run: mypy --ignore-missing-imports config scanner decision trading orchestrator shared

      - name: Run Tests
        run: pytest tests/ -v --tb=short

  integration-test:
    name: Integration Test (OKX Demo)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          OKX_API_KEY=${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET=${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE=${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO_TRADING=true
          SCAN_INTERVAL_SECONDS=120
          MIN_LIQUIDITY_USD=5000
          MAX_TOKEN_AGE_HOURS=2
          MIN_SCORE_TO_TRADE=70
          MAX_OPEN_POSITIONS=4
          MAX_PORTFOLIO_RISK_PCT=35
          POSITION_SIZE_PCT=10
          STOP_LOSS_PCT=15
          TRAILING_STOP_PCT=10
          LOG_LEVEL=INFO
          DB_URL=sqlite:///data/apex_scout.db
          EOF

      - name: Run integration smoke test
        run: |
          python main.py --test-config
          python -c "
          import asyncio, sys
          sys.path.insert(0, '.')
          from orchestrator.main import Orchestrator
          async def test():
              orch = Orchestrator()
              await orch.initialize()
              await orch._run_cycle()
              st = orch.get_status()
              print('INTEGRATION OK: cycles=%d tokens=%d pass=%d' % (
                  st['stats']['cycles_completed'],
                  st['stats']['tokens_scanned'],
                  st['stats']['decisions_pass'],
              ))
              await orch.cleanup()
          asyncio.run(test())
          "
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ github.event.inputs.skip_tests != 'true' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-up:
    name: Docker Compose Up (Smoke)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/compose-action@v2

      - name: Write .env (secrets for integration)
        run: |
          cat > .env <<EOF
          OKX_API_KEY=${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET=${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE=${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO_TRADING=true
          SCAN_INTERVAL_SECONDS=120
          MIN_LIQUIDITY_USD=5000
          MAX_TOKEN_AGE_HOURS=2
          MIN_SCORE_TO_TRADE=70
          MAX_OPEN_POSITIONS=4
          MAX_PORTFOLIO_RISK_PCT=35
          POSITION_SIZE_PCT=10
          STOP_LOSS_PCT=15
          TRAILING_STOP_PCT=10
          LOG_LEVEL=INFO
          DB_URL=sqlite:///data/apex_scout.db
          EOF

      - name: Docker Compose up
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker compose ps --services --filter "status=running" | wc -l)
            HEALTHY=$(docker compose ps --filter "status=healthy" | wc -l)
            echo "Running: $STATUS / Healthy: $HEALTHY"
            if [ "$HEALTHY" -ge 2 ]; then
              echo "✅ All services healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Services did not become healthy in time"
          docker compose ps
          docker compose logs bot --tail 50
          docker compose logs dashboard --tail 50
          exit 1

      - name: Smoke test dashboard
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501 || true)
          echo "Dashboard HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Dashboard not responding"
            exit 1
          fi
          echo "✅ Dashboard OK"

      - name: Docker Compose down
        if: always()
        run: docker compose down -v

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-docker, compose-up]
    if: always()
    steps:
      - name: Summarize results
        run: |
          LINT="${{ needs.lint-and-test.result }}"
          BUILD="${{ needs.build-docker.result }}"
          COMPOSE="${{ needs.compose-up.result }}"
          echo "lint-and-test: $LINT"
          echo "build-docker: $BUILD"
          echo "compose-up: $COMPOSE"
          if [ "$LINT" = "success" ] && [ "$BUILD" = "success" ] && [ "$COMPOSE" = "success" ]; then
            echo "🎉 All pipeline stages passed!"
          else
            echo "⚠️  Some stages failed or were skipped"
          fi
